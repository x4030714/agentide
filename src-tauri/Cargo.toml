[package]
name = "agentide"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# `raw_value` lets `lsp.rs` carry a language server's JSON message across the IPC
# boundary without parsing it into a `Value` on the way. See its module docs.
serde_json = { version = "1", features = ["raw_value"] }
tauri-plugin-dialog = "2"
notify = "7"
ignore = "0.4"
# The pty behind the terminal: ConPTY on Windows, `openpty` elsewhere.
portable-pty = "0.9"

# Both are already in the tree as dependencies of tauri's own (error-swallowing) window
# effects support; `window.rs` calls them directly because it has to report whether the
# effect applied, and to pick the effect by OS build.
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
windows-version = "0.1"

